<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NSE Option Chain | Live Data</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root {
            --bg: #07090f;
            --s1: #0d1117;
            --s2: #161b22;
            --s3: #21262d;
            --border: #30363d;
            --txt: #e6edf3;
            --txt2: #8b949e;
            --txt3: #6e7681;
            --c1: #58a6ff;
            --c2: #3fb850;
            --c3: #f85149;
            --c4: #d29922;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--txt);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.5;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 8px;
            padding-top: max(8px, env(safe-area-inset-top));
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        
        h1 {
            font-size: 1.3rem;
            margin-bottom: 0.25rem;
        }
        
        .header-subtitle {
            font-size: 0.7rem;
            color: var(--txt3);
            width: 100%;
        }
        
        .header-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, var(--c1), var(--c2));
            border: none;
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.7rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3);
        }
        
        .refresh-btn:active {
            transform: translateY(0);
        }
        
        .refresh-btn.loading svg {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .config-btn {
            background: var(--s2);
            border: 1px solid var(--border);
            color: var(--c1);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
        }
        
        .config-btn:hover {
            border-color: var(--c1);
            background: rgba(88, 166, 255, 0.1);
        }
        
        .upload-btn {
            background: var(--c3);
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
        }
        
        .upload-btn:hover {
            background: #ff6157;
        }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: var(--s1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-title {
            font-size: 1rem;
            font-weight: 600;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: var(--txt2);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .config-group {
            margin-bottom: 1rem;
        }
        
        .config-label {
            display: block;
            font-size: 0.75rem;
            color: var(--txt2);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .config-input {
            width: 100%;
            background: var(--s2);
            border: 1px solid var(--border);
            color: var(--txt);
            padding: 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .config-input:focus {
            outline: none;
            border-color: var(--c1);
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.2);
        }
        
        .add-btn, .save-config-btn {
            background: var(--c1);
            border: none;
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }
        
        .remove-btn {
            background: var(--c3);
            border: none;
            color: #fff;
            padding: 0.3rem 0.6rem;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.65rem;
            margin-top: 0.25rem;
        }
        
        .stock-cards-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        
        @media (min-width: 480px) {
            .stock-cards-container {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }
        
        @media (min-width: 768px) {
            .stock-cards-container {
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
            }
            .container {
                padding: 1.5rem;
            }
        }
        
        .stock-btn {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .stock-btn:active {
            border-color: var(--c1);
            background: rgba(88, 166, 255, 0.1);
        }
        
        .stock-btn.active {
            border-color: var(--c1);
            background: rgba(88, 166, 255, 0.1);
        }
        
        .sb-ticker {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--c1);
            letter-spacing: 1px;
        }
        
        .sb-name {
            font-size: 0.65rem;
            color: var(--txt2);
            margin-top: 3px;
        }
        
        .sb-price {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--txt);
            margin-top: 0.5rem;
        }
        
        .data-status {
            font-size: 0.65rem;
            color: var(--c2);
            background: rgba(63, 185, 80, 0.1);
            padding: 0.5rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--c2);
        }
        
        .expiry-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            -webkit-overflow-scrolling: touch;
        }
        
        .exp-btn {
            background: var(--s2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-size: 0.65rem;
            color: var(--txt2);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .exp-btn.active {
            background: rgba(88, 166, 255, 0.12);
            border-color: var(--c1);
            color: var(--c1);
        }
        
        .layout {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        @media (min-width: 900px) {
            .layout {
                display: grid;
                grid-template-columns: 1fr 350px;
                gap: 1.5rem;
            }
        }
        
        .chain-wrap {
            background: var(--s1);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .chain-header {
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
            background: var(--s2);
            font-size: 0.7rem;
        }
        
        .chain-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            max-height: 50vh;
            overflow-y: auto;
        }
        
        table.chain {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.65rem;
        }
        
        table.chain th {
            padding: 0.4rem 0.5rem;
            background: var(--s3);
            text-align: center;
            color: var(--txt2);
            font-weight: 600;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        table.chain td {
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid rgba(48, 54, 61, 0.5);
            text-align: center;
            white-space: nowrap;
        }
        
        table.chain tr.atm-row td {
            background: rgba(255, 215, 0, 0.05);
        }
        
        .strike-cell {
            font-weight: 600;
            color: #ffd700;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .panel {
            background: var(--s1);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
        }
        
        .panel-title {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--txt2);
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .analysis-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 0.5rem;
        }
        
        .analysis-label {
            color: var(--txt2);
        }
        
        .analysis-value {
            font-weight: 600;
            color: var(--c1);
        }
        
        .sentiment-bar {
            width: 100%;
            height: 4px;
            background: var(--s2);
            border-radius: 2px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        
        .sentiment-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--c3), var(--c4), var(--c2));
        }
        
        .news-item {
            background: var(--s2);
            border-left: 3px solid var(--c1);
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            font-size: 0.65rem;
        }
        
        .news-title {
            font-weight: 600;
            color: var(--c1);
            margin-bottom: 0.25rem;
        }
        
        .news-meta {
            font-size: 0.6rem;
            color: var(--txt3);
        }
        
        .chart-container {
            position: relative;
            height: 250px;
            margin-top: 0.5rem;
        }
        
        @media (min-width: 768px) {
            .chart-container {
                height: 300px;
            }
        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--s2);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--txt2);
        }
        
        input, button, select {
            font-size: 16px;
        }
        
        button {
            min-height: 44px;
            min-width: 44px;
        }

        .csv-upload {
            display: none;
        }

        .upload-info {
            font-size: 0.65rem;
            color: var(--txt3);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>📊 NSE Options Live</h1>
                <div class="header-subtitle">Real-time F&O Analysis | LIVE DATA from CSV</div>
            </div>
            <div class="header-controls">
                <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 4v6h6M23 20v-6h-6M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                    </svg>
                    Refresh
                </button>
                <button class="config-btn" onclick="openConfig()">⚙️ Config</button>
                <button class="upload-btn" onclick="document.getElementById('csvFile').click()">📁 Upload CSV</button>
                <input type="file" id="csvFile" accept=".csv" class="csv-upload" onchange="handleCSVUpload(event)">
            </div>
        </header>

        <div class="data-status" id="dataStatus">
            ✅ Loaded from: op070526.csv | Stocks: BHARTIARTL, JIOFIN, SBIN, TATASTEEL
        </div>
        
        <!-- CONFIG MODAL -->
        <div class="modal" id="configModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title">Configure Scrips</div>
                    <button class="close-btn" onclick="closeConfig()">&times;</button>
                </div>
                
                <div id="configList"></div>
                
                <div class="config-group">
                    <label class="config-label">Add New Scrip</label>
                    <input type="text" id="newTicker" class="config-input" placeholder="e.g., INFY">
                    <input type="text" id="newName" class="config-input" placeholder="Company Name">
                    <input type="text" id="newSector" class="config-input" placeholder="Sector">
                    <button class="add-btn" onclick="addNewScrip()">+ Add Scrip</button>
                </div>
                
                <button class="save-config-btn" onclick="saveConfig()" style="width: 100%; margin-top: 1rem;">Save Configuration</button>
            </div>
        </div>
        
        <div class="stock-cards-container" id="stockGrid"></div>
        
        <div class="layout">
            <div>
                <div class="expiry-bar" id="expiryTabs"></div>
                <div class="chain-wrap">
                    <div class="chain-header">Option Chain</div>
                    <div class="chain-table-wrap">
                        <table class="chain" id="chainTable">
                            <thead>
                                <tr>
                                    <th>CE LTP</th>
                                    <th>CE OI</th>
                                    <th>Strike</th>
                                    <th>PE OI</th>
                                    <th>PE LTP</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">Analysis</div>
                    <div class="analysis-row">
                        <span class="analysis-label">PCR</span>
                        <span class="analysis-value" id="pcrValue">—</span>
                    </div>
                    <div class="analysis-row">
                        <span class="analysis-label">Spot</span>
                        <span class="analysis-value" id="spotPrice">—</span>
                    </div>
                    <div class="sentiment-bar">
                        <div class="sentiment-fill" id="sentimentFill"></div>
                    </div>
                    <div class="analysis-row" style="margin-top: 0.5rem;">
                        <span class="analysis-value" id="signalVerdict">Analyzing...</span>
                    </div>
                </div>
                
                <div class="panel">
                    <div class="panel-title">📰 Market News</div>
                    <div id="newsList"></div>
                </div>
                
                <div class="panel">
                    <div class="panel-title">OI Chart</div>
                    <div class="chart-container">
                        <canvas id="oiChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

            document.getElementById('sentimentFill').style.width = sentimentPercent + '%';
            document.getElementById('signalVerdict').textContent = sentiment;
        }
        
        function renderNews() {
            const container = document.getElementById('newsList');
            container.innerHTML = '';
            
            const news = NEWS_DATA[currentStock] || [];
            news.forEach(item => {
                const div = document.createElement('div');
                div.className = 'news-item';
                div.innerHTML = `
                    <div class="news-title">${item['title']}</div>
                    <div class="news-meta">${item['date']} • ${item['source']}</div>
                `;
                container.appendChild(div);
            });
        }
        
        function updateChart() {
            if (!stocksData[currentStock] || !currentExpiry) return;
            
            const chain = stocksData[currentStock]['expiries'][currentExpiry];
            const ceChain = chain.filter(x => x['option_type'] === 'CE').sort((a, b) => a['strike'] - b['strike']);
            const spot = stocksData[currentStock]['spot'];
            const atmIndex = ceChain.findIndex(x => x['strike'] >= spot);
            const strikes = ceChain.slice(Math.max(0, atmIndex - 4), atmIndex + 5).map(x => x['strike']);
            
            const ceOi = strikes.map(s => {const ce = ceChain.find(x => x['strike'] === s); return ce ? ce['oi'] : 0;});
            
            const ctx = document.getElementById('oiChart').getContext('2d');
            if (oiChart) oiChart.destroy();
            
            oiChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: strikes.map(s => s.toFixed(0)),
                    datasets: [{
                        label: 'Call OI',
                        data: ceOi,
                        backgroundColor: 'rgba(63, 185, 80, 0.6)',
                        borderColor: 'rgba(63, 185, 80, 1)',
                        borderWidth: 1,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#8b949e', font: { size: 9 } } },
                        y: { ticks: { color: '#8b949e', font: { size: 9 } } }
                    }
                }
            });
        }
        
        function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('loading');
            btn.disabled = true;
            
            setTimeout(() => {
                update();
                btn.classList.remove('loading');
                btn.disabled = false;
                alert('✅ Data refreshed!');
            }, 1500);
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const csv = e.target.result;
                    const newData = parseCSVData(csv);
                    stocksData = newData;
                    update();
                    document.getElementById('dataStatus').textContent = '✅ Loaded from: ' + file.name + ' | Stocks: ' + Object.keys(stocksData).join(', ');
                    alert('✅ CSV data loaded successfully!');
                } catch (error) {
                    alert('❌ Error parsing CSV: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        function parseCSVData(csv) {
            const lines = csv.split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const stocks_data = {};
            
            const tickers_info = {
                'BHARTIARTL': {'name': 'Bharti Airtel', 'sector': 'Telecom'},
                'JIOFIN': {'name': 'Jio Finance', 'sector': 'Finance'},
                'SBIN': {'name': 'State Bank of India', 'sector': 'Banking'},
                'TATASTEEL': {'name': 'Tata Steel (TMPV)', 'sector': 'Metals'},
            };
            
            for (let ticker in tickers_info) {
                stocks_data[ticker] = {'expiries': {}, 'spot': 0};
            }
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const row = {};
                const values = lines[i].split(',');
                headers.forEach((header, idx) => {
                    row[header.trim()] = values[idx] ? values[idx].trim() : '';
                });
                
                const contract = row['CONTRACT_D'] || '';
                if (!contract.startsWith('OPTSTK')) continue;
                
                const cleanContract = contract.substring(6);
                let found = false;
                
                for (let i = 0; i < cleanContract.length && !found; i++) {
                    if (cleanContract[i] === '-' && cleanContract[i+5] === '-') {
                        const ticker = cleanContract.substring(0, i);
                        const rest = cleanContract.substring(i);
                        const dateEnd = rest.indexOf('-', 1) + 3;
                        const date = rest.substring(0, dateEnd);
                        const optStrike = rest.substring(dateEnd);
                        
                        if (!(ticker in tickers_info)) continue;
                        
                        let optType = '', strikeStr = '';
                        if (optStrike.includes('CE')) {
                            optType = 'CE';
                            strikeStr = optStrike.replace('CE', '').trim();
                        } else if (optStrike.includes('PE')) {
                            optType = 'PE';
                            strikeStr = optStrike.replace('PE', '').trim();
                        } else {
                            continue;
                        }
                        
                        try {
                            const strike = parseFloat(strikeStr);
                            const ltp = parseFloat(row['CLOSE_PRIC']) || 0;
                            const oi = parseInt(parseFloat(row['OI_NO_CON'])) || 0;
                            const volume = parseInt(parseFloat(row['TRADED_QUA'])) || 0;
                            const spot = parseFloat(row['UNDRLNG_ST']) || 0;
                            
                            if (!(date in stocks_data[ticker]['expiries'])) {
                                stocks_data[ticker]['expiries'][date] = [];
                            }
                            
                            stocks_data[ticker]['expiries'][date].push({
                                'strike': strike,
                                'option_type': optType,
                                'ltp': ltp,
                                'oi': oi,
                                'volume': volume,
                                'spot': spot
                            });
                            
                            stocks_data[ticker]['spot'] = spot;
                            found = true;
                        } catch (e) {
                            continue;
                        }
                    }
                }
            }
            
            // Sort data
            for (let ticker in stocks_data) {
                for (let expiry in stocks_data[ticker]['expiries']) {
                    stocks_data[ticker]['expiries'][expiry].sort((a, b) => a['strike'] - b['strike']);
                }
            }
            
            return stocks_data;
        }
        
        function openConfig() {
            renderConfigList();
            document.getElementById('configModal').classList.add('show');
        }
        
        function closeConfig() {
            document.getElementById('configModal').classList.remove('show');
        }
        
        function renderConfigList() {
            const list = document.getElementById('configList');
            list.innerHTML = '<div class="config-label">Current Scrips</div>';
            
            Object.keys(stocksConfig).forEach(ticker => {
                const info = stocksConfig[ticker];
                const div = document.createElement('div');
                div.className = 'config-group';
                div.innerHTML = `
                    <label class="config-label">${ticker}</label>
                    <input type="text" value="${info['name']}" class="config-input" placeholder="Company Name">
                    <input type="text" value="${info['sector']}" class="config-input" placeholder="Sector">
                    <button class="remove-btn" onclick="removeScrip('${ticker}')">Remove</button>
                `;
                list.appendChild(div);
            });
        }
        
        function addNewScrip() {
            const ticker = document.getElementById('newTicker').value.toUpperCase();
            const name = document.getElementById('newName').value;
            const sector = document.getElementById('newSector').value;
            
            if (!ticker || !name || !sector) {
                alert('Please fill all fields');
                return;
            }
            
            stocksConfig[ticker] = { name, sector };
            renderConfigList();
            document.getElementById('newTicker').value = '';
            document.getElementById('newName').value = '';
            document.getElementById('newSector').value = '';
        }
        
        function removeScrip(ticker) {
            if (confirm(`Remove ${ticker}?`)) {
                delete stocksConfig[ticker];
                if (currentStock === ticker) {
                    currentStock = Object.keys(stocksConfig)[0];
                }
                renderConfigList();
            }
        }
        
        function saveConfig() {
            localStorage.setItem('stocksConfig', JSON.stringify(stocksConfig));
            renderStocks();
            closeConfig();
            update();
            alert('✅ Configuration saved!');
        }
    </script>
</body>
